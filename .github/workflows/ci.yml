name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR runs cancel superseded ones; main runs queue instead, so a newer push
# can't kill judge-deploy mid-rollout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # next-env.d.ts (CSS/image module types) and route types are gitignored.
      - name: Generate Next.js types
        run: bunx next typegen
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test

  judge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: judge
      - name: Format
        run: cargo fmt --check
      # Allowed (pre-existing, intentional):
      # - upper_case_acronyms / non_camel_case_types: SubmissionStatus variants
      #   spell the Postgres labels verbatim (PENDING, CONSTRAINT_VIOLATION, ...).
      # - collapsible_if: style only.
      # - dead_code: sqlx FromRow fields kept for Debug / future use.
      - name: Clippy
        run: >-
          cargo clippy --locked --all-targets --
          -D warnings
          -A clippy::upper_case_acronyms
          -A non_camel_case_types
          -A clippy::collapsible_if
          -A dead_code
      # grade_tests run real submissions through isolate, which needs the
      # judge image + elevated capabilities (see judge/CLAUDE.md).
      - name: Test
        run: cargo test --locked -- --skip grade_tests

  # On main only, after the judge checks pass: push the judge image as
  # `latest` (fly.toml's default for a manual `fly deploy`), `sha-<commit>`
  # (immutable; what judge-deploy ships) and `v<Cargo.toml version>` (moves
  # until the version is bumped). Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
  judge-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "judge=$(sed -n 's/^version = "\(.*\)"/\1/p' judge/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: judge
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            whowon/why-runner-judge:latest
            whowon/why-runner-judge:sha-${{ github.sha }}
            whowon/why-runner-judge:v${{ steps.version.outputs.judge }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On main only: tag the commit `judge-vX.Y.Z` / `web-vX.Y.Z` the first time
  # judge/Cargo.toml or web/package.json carries a new version. Output
  # `judge_new` = this run created the judge tag (gates judge-deploy).
  release-tags:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, judge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      judge_new: ${{ steps.tags.outputs.judge_new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create missing version tags
        id: tags
        run: |
          judge="judge-v$(sed -n 's/^version = "\(.*\)"/\1/p' judge/Cargo.toml | head -1)"
          web="web-v$(jq -r .version web/package.json)"
          for tag in "$judge" "$web"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag exists"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
              if [ "$tag" = "$judge" ]; then
                echo "judge_new=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          done

  # On main only, when this run created a new `judge-vX.Y.Z` tag: deploy the
  # image judge-image just pushed (immutable `sha-<commit>`, not `latest`) to
  # Fly. Web-only merges and judge changes without a version bump skip this.
  # If the bump's run never tags (cancelled/failed), the next main run that
  # tags it deploys. Never overlaps another deploy (queue, no cancel).
  # Schema changes the judge needs must already be migrated (Vercel build) by
  # an earlier PR; see "Versioning" in the root CLAUDE.md.
  # Secret: FLY_API_TOKEN (`fly tokens create deploy -a why-runner-judge`).
  judge-deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-tags.outputs.judge_new == 'true'
    needs: [judge-image, release-tags]
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-why-runner-judge
      cancel-in-progress: false
    defaults:
      run:
        working-directory: judge
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a why-runner-judge --image whowon/why-runner-judge:sha-${{ github.sha }}

  enum-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Rust enums match Drizzle pgEnums
        run: bun scripts/check-enum-sync.ts
