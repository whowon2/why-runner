name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # next-env.d.ts (CSS/image module types) and route types are gitignored.
      - name: Generate Next.js types
        run: bunx next typegen
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test

  judge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: judge
      - name: Format
        run: cargo fmt --check
      # Allowed (pre-existing, intentional):
      # - upper_case_acronyms / non_camel_case_types: SubmissionStatus variants
      #   spell the Postgres labels verbatim (PENDING, CONSTRAINT_VIOLATION, ...).
      # - collapsible_if: style only.
      # - dead_code: sqlx FromRow fields kept for Debug / future use.
      - name: Clippy
        run: >-
          cargo clippy --locked --all-targets --
          -D warnings
          -A clippy::upper_case_acronyms
          -A non_camel_case_types
          -A clippy::collapsible_if
          -A dead_code
      # grade_tests run real submissions through isolate, which needs the
      # judge image + elevated capabilities (see judge/CLAUDE.md).
      - name: Test
        run: cargo test --locked -- --skip grade_tests

  # On main only, after the judge checks pass: push the judge image Fly pulls
  # (fly.toml: whowon/why-runner-judge:latest), plus `sha-<commit>` (immutable)
  # and `v<Cargo.toml version>` (moves until the version is bumped). Fly still needs `fly deploy` to pick
  # it up. Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
  judge-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "judge=$(sed -n 's/^version = "\(.*\)"/\1/p' judge/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: judge
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            whowon/why-runner-judge:latest
            whowon/why-runner-judge:sha-${{ github.sha }}
            whowon/why-runner-judge:v${{ steps.version.outputs.judge }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On main only: tag the commit `judge-vX.Y.Z` / `web-vX.Y.Z` the first time
  # judge/Cargo.toml or web/package.json carries a new version.
  release-tags:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, judge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing version tags
        run: |
          judge="judge-v$(sed -n 's/^version = "\(.*\)"/\1/p' judge/Cargo.toml | head -1)"
          web="web-v$(jq -r .version web/package.json)"
          for tag in "$judge" "$web"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag exists"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            fi
          done

  enum-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Rust enums match Drizzle pgEnums
        run: bun scripts/check-enum-sync.ts
