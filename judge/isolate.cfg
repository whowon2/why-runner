# Config for isolate boxes run inside the judge-worker container.
#
# NOTE: this isolate release (pinned via `--branch v2.7` in judge/Dockerfile's
# isolate-builder stage) does not support `dir = ...` bind-mount directives
# in the config file — that was a feature of older isolate releases.
# Directory visibility inside a box is now
# controlled per-run via `isolate --dir=...` CLI flags (Task 2/3's job), and
# isolate already ships built-in default rules that bind-mount /bin, /lib,
# /lib64 (if present) and /usr read-only into every box (see `isolate --help`
# / rules.c's `init_dir_rules`), which is exactly what's needed for
# judge-image-installed toolchains (python3, gcc/g++, rustc, JDK) to be
# reachable from inside a box without any extra config here.
box_root = /var/local/lib/isolate
lock_root = /run/isolate/locks
cg_root = /sys/fs/cgroup
first_uid = 60000
first_gid = 60000
num_boxes = 1000
